services:
  # Backend: FastAPI Web Service
  - type: web
    name: gleyforgym-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python create_db.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gleyforgym-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CLOUDINARY_URL
        sync: false # Set manually in Render dashboard
      - key: CORS_ORIGINS
        value: "https://gleyforgym-frontend.onrender.com"
      - key: FRONTEND_URL
        value: "https://gleyforgym-frontend.onrender.com"
      - key: BREVO_API_KEY
        sync: false # Set manually in Render dashboard (ver Pendientes.md P-03)
      - key: BREVO_SENDER_EMAIL
        sync: false # Set manually in Render dashboard (ver Pendientes.md P-03)
      - key: ANTHROPIC_API_KEY
        sync: false # Set manually in Render dashboard (integracion hibrida de IA, ver app/ia/claude_client.py)
      - key: CLAUDE_MODEL_IA
        value: claude-haiku-5-5 # Mismo default que app/config.py; cambiar aqui para usar otro modelo sin tocar codigo
      - key: SUNAT_RUC
        sync: false # Facturacion electronica (Boleta), ver Pendientes.md P-24 -- vacio = deshabilitado
      - key: SUNAT_USUARIO_SOL
        sync: false
      - key: SUNAT_CLAVE_SOL
        sync: false
      - key: SUNAT_AMBIENTE
        value: beta # Cambiar a "produccion" solo tras confirmar el RUC como emisor electronico (ver el plan de implementacion)
      - key: SUNAT_WSDL_PRODUCCION
        sync: false
      - key: SUNAT_CERTIFICADO_PEM
        sync: false
      - key: SUNAT_LLAVE_PRIVADA_PEM
        sync: false
      - key: SUNAT_SERIE_BOLETA
        value: B001

  # Frontend: React Static Site
  - type: web
    name: gleyforgym-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: web-admin
    routes:
      # Rewrite rule to route all frontend paths to index.html (SPA routing support)
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://gleyforgym-backend.onrender.com # Public backend URL

databases:
  # Managed PostgreSQL Database
  - name: gleyforgym-db
    databaseName: gleyforgym
    plan: free
